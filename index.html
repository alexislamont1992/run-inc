<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14181f">
  <title>Run Inc</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏃</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="countdown" id="countdown"></div>
    <nav class="weeknav">
      <button id="prevWeek" aria-label="Previous week">‹</button>
      <button id="todayBtn" class="today-btn">Today</button>
      <label class="weeklabel">
        <span id="weekLabel"></span>
        <input type="date" id="datePicker" aria-label="Jump to week">
      </label>
      <button id="nextWeek" aria-label="Next week">›</button>
    </nav>
    <div class="colheads" id="colheads"></div>
  </header>

  <main id="grid" class="grid"></main>

  <footer class="totals" id="totals"></footer>

  <dialog id="editor" class="editor"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
